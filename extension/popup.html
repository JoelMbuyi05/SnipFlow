<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snipflow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
    }

    .header {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: white;
      color: #3b82f6;
      border: 2px solid #3b82f6;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #3b82f6;
      color: white;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1><i class="fas fa-code"></i> Snipflow</h1>
    <p>Save code snippets from anywhere</p>
  </div>

  <!-- Status Message -->
  <div id="statusMessage" class="status hidden"></div>

  <!-- Main Container -->
  <div class="container">
    <form id="snippetForm">
      
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="title" placeholder="e.g., React useState Hook" required>
      </div>

      <div class="form-group">
        <label>Language *</label>
        <select id="language" required>
          <option value="">Select language...</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="TypeScript">TypeScript</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="PHP">PHP</option>
          <option value="Ruby">Ruby</option>
          <option value="Go">Go</option>
          <option value="Rust">Rust</option>
          <option value="C++">C++</option>
          <option value="C#">C#</option>
        </select>
      </div>

      <div class="form-group">
        <label>Code *</label>
        <textarea id="code" placeholder="Paste your code here..." required></textarea>
      </div>

      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g., react, hooks, state">
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Save to Snipflow
      </button>

    </form>
  </div>

  <script src="popup.js"></script>

</body>
</html>
