<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnipFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 400px;
            max-height: 600px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e4e4e7;
            overflow: hidden;
        }

        .header {
            background: #18181b;
            border-bottom: 1px solid #27272a;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            background: #18181b;
            border-bottom: 1px solid #27272a;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 11px;
            color: #71717a;
            margin-top: 2px;
        }

        .recent-snippets {
            padding: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .recent-title {
            font-size: 12px;
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .snippet-item {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .snippet-item:hover {
            border-color: #3b82f6;
            background: #1c1c1f;
        }

        .snippet-item-title {
            font-size: 13px;
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .snippet-item-meta {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: #71717a;
        }

        .language-badge {
            background: #3b82f6;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #71717a;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #a1a1aa;
        }

        .empty-state p {
            font-size: 12px;
            line-height: 1.5;
        }

        .actions {
            padding: 12px;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #27272a;
            color: #e4e4e7;
        }

        .btn-secondary:hover {
            background: #3f3f46;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #71717a;
        }

        .spinner {
            border: 3px solid #27272a;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #18181b;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-code"></i>
            <span>SnipFlow</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="total-snippets">0</div>
            <div class="stat-label">Snippets</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="total-languages">0</div>
            <div class="stat-label">Languages</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="total-tags">0</div>
            <div class="stat-label">Tags</div>
        </div>
    </div>

    <div class="recent-snippets">
        <div class="recent-title">Recent Captures</div>
        <div id="snippets-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading snippets...</p>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="open-dashboard-btn">
            📊 Dashboard
        </button>
        <button class="btn btn-secondary" id="export-btn">
            ⬇️ Export
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
